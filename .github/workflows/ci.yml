name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # lint (oxlint + oxfmt) → typecheck (App + SW + Worker) → test (Vitest) → build (SPA + PWA).
  # The Worker deploy is handled by Cloudflare Workers Builds (Git integration).
  ci:
    uses: daniel-rck/web-base/.github/workflows/web-app-ci.yml@main

  # Fails the build when an owned web-base building block has drifted from the
  # base. Scaffold seams (theme.css accent, db schema, routes, worker handlers)
  # are ignored. Pinned to @main rather than a version tag: web-base has no
  # tag for 0.5.0 (webBase.version) yet; swap `@main` for `@v0.5.0` then.
  web-base-check:
    uses: daniel-rck/web-base/.github/workflows/web-base-check.yml@main
